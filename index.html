<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isha &amp; Akshat — Engagement Invitations</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;

    background: linear-gradient(160deg, #fff5f0, #f9d5cb); padding: 24px; box-sizing: border-box; }
  .card { max-width: 420px; }
  h1 { font-size: 30px; margin: 6px 0 2px; color:#7c1d3f; }
  .sub { letter-spacing: 3px; font-size: 11px; text-transform: uppercase; color:#a05c2c; }
  .date { margin: 10px 0 22px; font-size: 16px; }
  a.btn { display:block; margin: 12px auto; padding: 15px 10px; max-width: 320px; border-radius: 40px;

  .bride { background: linear-gradient(180deg,#8e2453,#6d1a40); color:#ffe9b8; }
  .groom { background: linear-gradient(180deg,#5c0e14,#3d090d); color:#f2ce84; }
  .foot { margin-top: 26px; font-size: 12px; color:#96604a; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="card">
    <div class="sub">The Engagement Of</div>
    <h1>Isha &amp; Akshat</h1>
    <div class="date">Friday, 11 December 2026 · 4:00 PM · Tajview, Agra</div>
    <a class="btn bride" href="./isha-akshat/">Open Bride-Side Invitation</a>
    <a class="btn groom" href="./akshat-isha/">Open Groom-Side Invitation</a>
    <div class="foot">Nimantran Kala</div>
  </div>
